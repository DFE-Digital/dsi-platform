name: Hello World

on:
  push:
    branches:
      - chore/DSI-111-test-ci
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "Hello World"

  build-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: build project
        run: dotnet build 'src/Dfe.SignIn.Core.Entities/Dfe.SignIn.Core.Entities.csproj' --configuration Release

      - name: Build Docker image
        run: |
          docker build -f temp/TestWebApp/Dockerfile -t testwebapp:latest \.

      - name: Log in to Azure Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ${{ vars.ACR_REGISTRY_TRAN }}
          username: ${{ secrets[format('ACR_{0}_CLIENT_ID', secrets.ACR_TRAN_CLIENT_ID)] }}
          password: ${{ secrets[format('ACR_{0}_CLIENT_SECRET', inputs.ACR_TRAN_CLIENT_SECRET)] }}
    